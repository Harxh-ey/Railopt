databases:
  - name: railopt-db
    plan: free
    region: singapore
    databaseName: railopt
    user: railopt

services:
  - type: web
    name: railopt
    runtime: docker
    region: singapore
    plan: free
    dockerfilePath: ./Dockerfile
    envVars:
      - key: PORT
        value: 10000
      - key: DATABASE_URL
        fromDatabase:
          name: railopt-db
          property: connectionString
      - key: JWT_SECRET
        generateValue: true
      - key: ENVIRONMENT
        value: production
